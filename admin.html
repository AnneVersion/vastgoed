<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vastgoed Admin - DataConsultants</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='none' stroke='%2339ff14' stroke-width='1.5'/><circle cx='16' cy='16' r='3' fill='%2339ff14' opacity='.4'/><ellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%2339ff14' stroke-width='.7' opacity='.4' transform='rotate(-8 16 16)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f1a;
  --bg2: #111827;
  --bg3: #1a2235;
  --accent: #39ff14;
  --accent-dim: rgba(57, 255, 20, 0.15);
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: rgba(57, 255, 20, 0.12);
  --glass: rgba(17, 24, 39, 0.75);
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --red: #f87171;
  --yellow: #fbbf24;
  --blue: #60a5fa;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* NAV */
nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
}
.nav-brand {
  font-family: 'Space Mono', monospace;
  font-size: 1.1rem; font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  display: flex; align-items: center; gap: .5rem;
}
.nav-links { display: flex; gap: 1rem; align-items: center; }
.nav-links a, .nav-links button {
  color: var(--text-dim); text-decoration: none; font-size: .9rem;
  background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: color .2s;
}
.nav-links a:hover, .nav-links button:hover { color: var(--accent); }
.tab-btn { padding: .4rem .8rem; border-radius: 6px; }
.tab-btn.active { background: var(--accent-dim); color: var(--accent) !important; }

/* LOGIN */
.login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 64px); padding: 2rem;
}
.login-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3rem;
  max-width: 400px; width: 100%; text-align: center;
}
.login-box h2 {
  font-family: 'Space Mono', monospace;
  color: var(--accent); margin-bottom: .5rem; font-size: 1.5rem;
}
.login-box p { color: var(--text-dim); margin-bottom: 2rem; font-size: .9rem; }
.login-box input {
  width: 100%; padding: .8rem 1rem;
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; font-size: 1rem; font-family: 'DM Sans', sans-serif;
  outline: none; margin-bottom: 1rem;
}
.login-box input:focus { border-color: var(--accent); }
.login-error { color: var(--red); font-size: .85rem; margin-bottom: 1rem; display: none; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .7rem 1.5rem; border-radius: 8px; font-size: .9rem;
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: .2s; border: none;
}
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: #2de00f; }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-danger { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-sm { padding: .4rem .8rem; font-size: .8rem; }

/* DASHBOARD */
.dashboard { display: none; }

/* STATS */
.stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem; padding: 2rem; max-width: 1400px; margin: 0 auto;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.2rem 1.5rem;
}
.stat-card .label {
  font-size: .72rem; text-transform: uppercase; color: var(--text-dim);
  font-family: 'Space Mono', monospace; letter-spacing: .04em;
}
.stat-card .value {
  font-size: 1.8rem; font-weight: 700;
  font-family: 'Space Mono', monospace; margin-top: .25rem;
}
.stat-card .value.green { color: var(--accent); }
.stat-card .value.blue { color: var(--blue); }
.stat-card .value.yellow { color: var(--yellow); }
.stat-card .value.red { color: var(--red); }

/* ADMIN GRID */
.admin-grid {
  max-width: 1400px; margin: 0 auto; padding: 0 2rem 3rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}
.admin-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.2rem; cursor: pointer;
  transition: border-color .2s, transform .2s;
  display: flex; gap: 1rem; align-items: flex-start;
}
.admin-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.admin-card-icon {
  width: 48px; height: 48px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 1.2rem;
}
.admin-card-icon.beschikbaar { background: var(--accent-dim); color: var(--accent); }
.admin-card-icon.verhuurd { background: rgba(96,165,250,0.15); color: var(--blue); }
.admin-card-body { flex: 1; min-width: 0; }
.admin-card-body h3 { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-card-body .sub { font-size: .82rem; color: var(--text-dim); }
.admin-card-body .price { font-family: 'Space Mono', monospace; color: var(--accent); font-size: .9rem; font-weight: 700; }

/* EDIT PANEL (slide-in) */
.panel-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
}
.panel-overlay.active { display: block; }
.edit-panel {
  position: fixed; top: 0; right: -600px; width: 600px; max-width: 100vw;
  height: 100vh; background: var(--bg2); border-left: 1px solid var(--border);
  z-index: 201; overflow-y: auto; transition: right .3s ease;
  box-shadow: -8px 0 32px rgba(0,0,0,0.5);
}
.edit-panel.active { right: 0; }
.panel-header {
  position: sticky; top: 0; background: var(--bg2);
  padding: 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  z-index: 1;
}
.panel-header h2 { font-size: 1.2rem; }
.panel-close {
  background: none; border: none; color: var(--text-dim);
  font-size: 1.5rem; cursor: pointer; line-height: 1;
}
.panel-close:hover { color: var(--accent); }
.panel-body { padding: 1.5rem; }
.panel-section {
  margin-bottom: 2rem;
}
.panel-section h3 {
  font-size: .8rem; text-transform: uppercase; color: var(--text-dim);
  font-family: 'Space Mono', monospace; letter-spacing: .05em;
  margin-bottom: .75rem; padding-bottom: .5rem;
  border-bottom: 1px solid var(--border);
}

/* FORM FIELDS */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: .75rem; }
.form-row.full { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: .3rem; }
.form-group label {
  font-size: .72rem; text-transform: uppercase; color: var(--text-dim);
  font-family: 'Space Mono', monospace; letter-spacing: .03em;
}
.form-group input,
.form-group select,
.form-group textarea {
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: .5rem .7rem; font-size: .88rem;
  font-family: 'DM Sans', sans-serif; outline: none; transition: border-color .2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color: var(--accent); }
.form-group select option { background: var(--bg2); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-check {
  display: flex; align-items: center; gap: .5rem; padding: .5rem 0;
}
.form-check input[type="checkbox"] {
  appearance: none; width: 36px; height: 20px;
  background: var(--bg3); border-radius: 10px; position: relative;
  cursor: pointer; border: 1px solid var(--border); transition: .2s;
}
.form-check input[type="checkbox"]::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--text-dim); transition: .2s;
}
.form-check input[type="checkbox"]:checked { background: var(--accent-dim); border-color: var(--accent); }
.form-check input[type="checkbox"]:checked::after { left: 18px; background: var(--accent); }

/* ONDERHOUD LIST */
.onderhoud-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
.onderhoud-item {
  background: var(--bg3); border-radius: 8px; padding: .75rem;
  border: 1px solid var(--border);
}
.onderhoud-item .oh-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .25rem; }
.onderhoud-item .oh-desc { font-size: .9rem; }
.onderhoud-item .oh-meta { font-size: .78rem; color: var(--text-dim); font-family: 'Space Mono', monospace; }
.oh-status {
  font-size: .7rem; padding: .15rem .5rem; border-radius: 12px;
  font-family: 'Space Mono', monospace; text-transform: uppercase;
}
.oh-status.afgerond { background: var(--accent-dim); color: var(--accent); }
.oh-status.in_behandeling { background: rgba(251,191,36,0.15); color: var(--yellow); }
.oh-status.gepland { background: rgba(96,165,250,0.15); color: var(--blue); }

/* ONDERHOUD FORM */
.oh-form {
  background: var(--bg3); border-radius: 8px; padding: 1rem;
  border: 1px solid var(--border);
}
.oh-form h4 { font-size: .8rem; color: var(--accent); margin-bottom: .75rem; }

/* TOAST */
.toast {
  position: fixed; bottom: 2rem; right: 2rem; z-index: 300;
  background: var(--accent); color: var(--bg); padding: .8rem 1.5rem;
  border-radius: 8px; font-weight: 600; font-size: .9rem;
  transform: translateY(100px); opacity: 0; transition: .3s;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* FINANCIEEL TAB */
.financieel-section { max-width: 1400px; margin: 0 auto; padding: 2rem; display: none; }
.fin-table-wrap {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.fin-table { width: 100%; border-collapse: collapse; }
.fin-table th {
  text-align: left; padding: .75rem 1rem;
  font-size: .72rem; text-transform: uppercase; color: var(--text-dim);
  font-family: 'Space Mono', monospace; letter-spacing: .04em;
  background: var(--bg3); border-bottom: 1px solid var(--border);
}
.fin-table td {
  padding: .75rem 1rem; border-bottom: 1px solid var(--border);
  font-size: .88rem;
}
.fin-table tr:last-child td { border-bottom: none; }
.fin-table .num { font-family: 'Space Mono', monospace; text-align: right; }
.fin-table .green { color: var(--accent); }
.fin-table .red { color: var(--red); }
.fin-totals {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem; margin-top: 1.5rem;
}

/* PANEL ACTIONS */
.panel-actions {
  position: sticky; bottom: 0; background: var(--bg2);
  padding: 1rem 1.5rem; border-top: 1px solid var(--border);
  display: flex; gap: .75rem; justify-content: flex-end;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav { padding: 0 1rem; }
  .stats-bar { padding: 1rem; grid-template-columns: 1fr 1fr; }
  .admin-grid { padding: 0 1rem 2rem; grid-template-columns: 1fr; }
  .edit-panel { width: 100vw; }
  .form-row { grid-template-columns: 1fr; }
  .financieel-section { padding: 1rem; }
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="16" r="14" fill="none" stroke="#39ff14" stroke-width="1.5"/><circle cx="16" cy="16" r="3" fill="#39ff14" opacity=".4"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#39ff14" stroke-width=".7" opacity=".4" transform="rotate(-8 16 16)"/></svg>
    Vastgoed Admin
  </a>
  <div class="nav-links" id="navTabs" style="display:none;">
    <button class="tab-btn active" onclick="switchTab('panden')">Panden</button>
    <button class="tab-btn" onclick="switchTab('financieel')">Financieel</button>
    <a href="index.html">Publieke site</a>
    <button onclick="logout()">Uitloggen</button>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>Admin Login</h2>
    <p>Voer het wachtwoord in om toegang te krijgen tot het beheerpaneel</p>
    <div class="login-error" id="loginError">Ongeldig wachtwoord</div>
    <input type="password" id="loginPassword" placeholder="Wachtwoord" autofocus>
    <button class="btn btn-primary" style="width:100%" onclick="login()">Inloggen</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <!-- Stats -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Panden Tab -->
  <div id="pandenTab">
    <div class="admin-grid" id="adminGrid"></div>
  </div>

  <!-- Financieel Tab -->
  <div class="financieel-section" id="financieelTab"></div>
</div>

<!-- Edit Panel -->
<div class="panel-overlay" id="panelOverlay"></div>
<div class="edit-panel" id="editPanel">
  <div class="panel-header">
    <h2 id="panelTitle">Pand bewerken</h2>
    <button class="panel-close" onclick="closePanel()">&times;</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-actions">
    <button class="btn btn-secondary" onclick="closePanel()">Annuleren</button>
    <button class="btn btn-primary" onclick="savePand()">Opslaan</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const PASSWORD = 'admin';
let allPanden = [];
let editingId = null;

// === AUTH ===
function checkAuth() {
  if (sessionStorage.getItem('vastgoed_admin') === 'true') {
    showDashboard();
  }
}

function login() {
  const pw = document.getElementById('loginPassword').value;
  if (pw === PASSWORD) {
    sessionStorage.setItem('vastgoed_admin', 'true');
    showDashboard();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
  }
}

document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

function logout() {
  sessionStorage.removeItem('vastgoed_admin');
  location.reload();
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('navTabs').style.display = 'flex';
  loadPanden();
}

// === TABS ===
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('pandenTab').style.display = tab === 'panden' ? 'block' : 'none';
  document.getElementById('financieelTab').style.display = tab === 'financieel' ? 'block' : 'none';
  if (tab === 'financieel') renderFinancieel();
}

// === DATA ===
async function loadPanden() {
  const res = await fetch('/api/panden');
  allPanden = await res.json();
  renderStats();
  renderAdminGrid();
}

function renderStats() {
  const total = allPanden.length;
  const verhuurd = allPanden.filter(p => !p.beschikbaar).length;
  const beschikbaar = total - verhuurd;
  const income = allPanden.filter(p => !p.beschikbaar).reduce((s, p) => s + p.huurprijs, 0);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="label">Totaal panden</div><div class="value blue">${total}</div></div>
    <div class="stat-card"><div class="label">Verhuurd</div><div class="value green">${verhuurd}</div></div>
    <div class="stat-card"><div class="label">Beschikbaar</div><div class="value yellow">${beschikbaar}</div></div>
    <div class="stat-card"><div class="label">Maandinkomen</div><div class="value green">&euro;${income.toLocaleString('nl-NL')}</div></div>
  `;
}

function renderAdminGrid() {
  const grid = document.getElementById('adminGrid');
  grid.innerHTML = allPanden.map(p => `
    <div class="admin-card" onclick="openEdit('${p.id}')">
      <div class="admin-card-icon ${p.beschikbaar ? 'beschikbaar' : 'verhuurd'}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      </div>
      <div class="admin-card-body">
        <h3>${esc(p.naam)}</h3>
        <div class="sub">${esc(p.adres)}, ${esc(p.stad)}</div>
        <div class="sub">${p.beschikbaar ? 'Beschikbaar' : `Verhuurd aan ${esc(p.huurder?.naam || '-')}`}</div>
        <div class="price">&euro;${p.huurprijs.toLocaleString('nl-NL')}/mnd</div>
      </div>
    </div>
  `).join('');
}

// === EDIT PANEL ===
function openEdit(id) {
  editingId = id;
  const p = allPanden.find(x => x.id === id);
  if (!p) return;

  document.getElementById('panelTitle').textContent = p.naam;
  document.getElementById('panelBody').innerHTML = `
    <div class="panel-section">
      <h3>Algemeen</h3>
      <div class="form-row">
        <div class="form-group"><label>Naam</label><input id="e_naam" value="${attr(p.naam)}"></div>
        <div class="form-group"><label>Type</label>
          <select id="e_type">
            <option value="appartement" ${p.type==='appartement'?'selected':''}>Appartement</option>
            <option value="studio" ${p.type==='studio'?'selected':''}>Studio</option>
            <option value="woonhuis" ${p.type==='woonhuis'?'selected':''}>Woonhuis</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Adres</label><input id="e_adres" value="${attr(p.adres)}"></div>
        <div class="form-group"><label>Postcode</label><input id="e_postcode" value="${attr(p.postcode)}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Stad</label><input id="e_stad" value="${attr(p.stad)}"></div>
        <div class="form-group"><label>Energielabel</label>
          <select id="e_energielabel">
            ${['A','B','C','D','E','F','G'].map(l => `<option ${p.energielabel===l?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Huurprijs (&euro;/mnd)</label><input type="number" id="e_huurprijs" value="${p.huurprijs}"></div>
        <div class="form-group"><label>Oppervlakte (m&sup2;)</label><input type="number" id="e_oppervlakte" value="${p.oppervlakte_m2}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Kamers</label><input type="number" id="e_kamers" value="${p.kamers}"></div>
        <div class="form-group"><label>Slaapkamers</label><input type="number" id="e_slaapkamers" value="${p.slaapkamers}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Beschikbaar vanaf</label><input type="date" id="e_beschikbaar_vanaf" value="${p.beschikbaar_vanaf || ''}"></div>
        <div class="form-group">
          <label>Status</label>
          <div class="form-check">
            <input type="checkbox" id="e_beschikbaar" ${p.beschikbaar ? 'checked' : ''}>
            <span style="font-size:.85rem">Beschikbaar</span>
          </div>
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group"><label>Kenmerken (komma-gescheiden)</label><input id="e_kenmerken" value="${attr(p.kenmerken.join(', '))}"></div>
      </div>
      <div class="form-row full">
        <div class="form-group"><label>Notities</label><textarea id="e_notities">${esc(p.notities || '')}</textarea></div>
      </div>
    </div>

    <div class="panel-section">
      <h3>Huurder</h3>
      <div id="huurderFields">
        ${p.huurder ? `
          <div class="form-row">
            <div class="form-group"><label>Naam</label><input id="e_h_naam" value="${attr(p.huurder.naam)}"></div>
            <div class="form-group"><label>Email</label><input id="e_h_email" value="${attr(p.huurder.email)}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Telefoon</label><input id="e_h_telefoon" value="${attr(p.huurder.telefoon)}"></div>
            <div class="form-group"><label>Huurstart</label><input type="date" id="e_h_huurstart" value="${p.huurder.huurstart || ''}"></div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removeHuurder()">Huurder verwijderen</button>
        ` : `
          <p style="color:var(--text-dim); font-size:.88rem; margin-bottom:.75rem;">Geen huurder gekoppeld</p>
          <button class="btn btn-secondary btn-sm" onclick="addHuurderFields()">+ Huurder toevoegen</button>
        `}
      </div>
    </div>

    <div class="panel-section">
      <h3>Onderhoud</h3>
      <div class="onderhoud-list" id="onderhoudList">
        ${(p.onderhoud || []).map(o => `
          <div class="onderhoud-item">
            <div class="oh-top">
              <span class="oh-desc">${esc(o.beschrijving)}</span>
              <span class="oh-status ${o.status}">${statusLabel(o.status)}</span>
            </div>
            <div class="oh-meta">${formatDate(o.datum)} &middot; &euro;${Number(o.kosten).toFixed(2)}</div>
          </div>
        `).join('')}
        ${(p.onderhoud || []).length === 0 ? '<p style="color:var(--text-dim); font-size:.85rem;">Geen onderhoud geregistreerd</p>' : ''}
      </div>

      <div class="oh-form">
        <h4>+ Nieuw onderhoud</h4>
        <div class="form-row full">
          <div class="form-group"><label>Beschrijving</label><input id="oh_beschrijving" placeholder="Bijv. CV-ketel reparatie"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Kosten (&euro;)</label><input type="number" id="oh_kosten" value="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="oh_datum" value="${today()}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Status</label>
            <select id="oh_status">
              <option value="gepland">Gepland</option>
              <option value="in_behandeling">In behandeling</option>
              <option value="afgerond">Afgerond</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end">
            <button class="btn btn-secondary btn-sm" onclick="addOnderhoud()">Toevoegen</button>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('panelOverlay').classList.add('active');
  setTimeout(() => document.getElementById('editPanel').classList.add('active'), 10);
}

function closePanel() {
  document.getElementById('editPanel').classList.remove('active');
  setTimeout(() => document.getElementById('panelOverlay').classList.remove('active'), 300);
  editingId = null;
}

document.getElementById('panelOverlay').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

function removeHuurder() {
  document.getElementById('huurderFields').innerHTML = `
    <p style="color:var(--text-dim); font-size:.88rem; margin-bottom:.75rem;">Huurder wordt verwijderd bij opslaan</p>
    <input type="hidden" id="e_h_removed" value="true">
    <button class="btn btn-secondary btn-sm" onclick="addHuurderFields()">+ Huurder toevoegen</button>
  `;
}

function addHuurderFields() {
  document.getElementById('huurderFields').innerHTML = `
    <div class="form-row">
      <div class="form-group"><label>Naam</label><input id="e_h_naam" value=""></div>
      <div class="form-group"><label>Email</label><input id="e_h_email" value=""></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Telefoon</label><input id="e_h_telefoon" value=""></div>
      <div class="form-group"><label>Huurstart</label><input type="date" id="e_h_huurstart" value="${today()}"></div>
    </div>
    <button class="btn btn-danger btn-sm" onclick="removeHuurder()">Huurder verwijderen</button>
  `;
}

async function addOnderhoud() {
  const beschrijving = document.getElementById('oh_beschrijving').value.trim();
  if (!beschrijving) return;
  const body = {
    beschrijving,
    kosten: parseFloat(document.getElementById('oh_kosten').value) || 0,
    datum: document.getElementById('oh_datum').value,
    status: document.getElementById('oh_status').value,
  };
  const res = await fetch(`/api/panden/${editingId}/onderhoud`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    showToast('Onderhoud toegevoegd');
    await loadPanden();
    openEdit(editingId);
  }
}

async function savePand() {
  const p = allPanden.find(x => x.id === editingId);
  if (!p) return;

  const updated = {
    ...p,
    naam: val('e_naam'),
    type: val('e_type'),
    adres: val('e_adres'),
    postcode: val('e_postcode'),
    stad: val('e_stad'),
    energielabel: val('e_energielabel'),
    huurprijs: parseInt(val('e_huurprijs')) || 0,
    oppervlakte_m2: parseInt(val('e_oppervlakte')) || 0,
    kamers: parseInt(val('e_kamers')) || 0,
    slaapkamers: parseInt(val('e_slaapkamers')) || 0,
    beschikbaar: document.getElementById('e_beschikbaar').checked,
    beschikbaar_vanaf: val('e_beschikbaar_vanaf'),
    kenmerken: val('e_kenmerken').split(',').map(s => s.trim()).filter(Boolean),
    notities: val('e_notities'),
  };

  // Huurder
  const removed = document.getElementById('e_h_removed');
  const hNaam = document.getElementById('e_h_naam');
  if (removed) {
    updated.huurder = null;
  } else if (hNaam) {
    updated.huurder = {
      naam: val('e_h_naam'),
      email: val('e_h_email'),
      telefoon: val('e_h_telefoon'),
      huurstart: val('e_h_huurstart'),
    };
  }

  const res = await fetch(`/api/panden/${editingId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(updated),
  });

  if (res.ok) {
    showToast('Pand opgeslagen');
    closePanel();
    await loadPanden();
  } else {
    showToast('Fout bij opslaan');
  }
}

// === FINANCIEEL ===
function renderFinancieel() {
  const section = document.getElementById('financieelTab');
  const verhuurd = allPanden.filter(p => !p.beschikbaar);
  const totalIncome = verhuurd.reduce((s, p) => s + p.huurprijs, 0);
  const totalOnderhoud = allPanden.reduce((s, p) => s + (p.onderhoud || []).reduce((ss, o) => ss + Number(o.kosten), 0), 0);

  section.innerHTML = `
    <h2 style="font-family:'Space Mono',monospace; color:var(--accent); margin-bottom:1.5rem;">Financieel Overzicht</h2>
    <div class="fin-totals">
      <div class="stat-card"><div class="label">Maandelijks huurinkomen</div><div class="value green">&euro;${totalIncome.toLocaleString('nl-NL')}</div></div>
      <div class="stat-card"><div class="label">Jaarlijks huurinkomen</div><div class="value green">&euro;${(totalIncome * 12).toLocaleString('nl-NL')}</div></div>
      <div class="stat-card"><div class="label">Totale onderhoudskosten</div><div class="value red">&euro;${totalOnderhoud.toLocaleString('nl-NL', { minimumFractionDigits: 2 })}</div></div>
      <div class="stat-card"><div class="label">Bezettingsgraad</div><div class="value yellow">${allPanden.length ? Math.round(verhuurd.length / allPanden.length * 100) : 0}%</div></div>
    </div>

    <h3 style="font-family:'Space Mono',monospace; color:var(--text-dim); margin: 2rem 0 1rem; font-size:.85rem; text-transform:uppercase;">Inkomsten per pand</h3>
    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead>
          <tr>
            <th>Pand</th>
            <th>Stad</th>
            <th>Status</th>
            <th style="text-align:right">Huur/mnd</th>
            <th style="text-align:right">Huur/jaar</th>
            <th style="text-align:right">Onderhoud</th>
            <th style="text-align:right">Netto/jaar</th>
          </tr>
        </thead>
        <tbody>
          ${allPanden.map(p => {
            const oh = (p.onderhoud || []).reduce((s, o) => s + Number(o.kosten), 0);
            const yearIncome = p.beschikbaar ? 0 : p.huurprijs * 12;
            const netto = yearIncome - oh;
            return `<tr>
              <td>${esc(p.naam)}</td>
              <td>${esc(p.stad)}</td>
              <td>${p.beschikbaar ? '<span style="color:var(--yellow)">Beschikbaar</span>' : '<span style="color:var(--accent)">Verhuurd</span>'}</td>
              <td class="num ${p.beschikbaar ? '' : 'green'}">&euro;${p.beschikbaar ? '-' : p.huurprijs.toLocaleString('nl-NL')}</td>
              <td class="num ${p.beschikbaar ? '' : 'green'}">&euro;${yearIncome ? yearIncome.toLocaleString('nl-NL') : '-'}</td>
              <td class="num red">&euro;${oh ? oh.toFixed(2) : '-'}</td>
              <td class="num ${netto >= 0 ? 'green' : 'red'}">&euro;${netto ? netto.toLocaleString('nl-NL', { minimumFractionDigits: 2 }) : '-'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <h3 style="font-family:'Space Mono',monospace; color:var(--text-dim); margin: 2rem 0 1rem; font-size:.85rem; text-transform:uppercase;">Onderhoud details</h3>
    <div class="fin-table-wrap">
      <table class="fin-table">
        <thead>
          <tr><th>Datum</th><th>Pand</th><th>Beschrijving</th><th>Status</th><th style="text-align:right">Kosten</th></tr>
        </thead>
        <tbody>
          ${allPanden.flatMap(p => (p.onderhoud || []).map(o => ({ ...o, pandNaam: p.naam }))).sort((a, b) => b.datum.localeCompare(a.datum)).map(o => `
            <tr>
              <td class="num">${formatDate(o.datum)}</td>
              <td>${esc(o.pandNaam)}</td>
              <td>${esc(o.beschrijving)}</td>
              <td><span class="oh-status ${o.status}">${statusLabel(o.status)}</span></td>
              <td class="num red">&euro;${Number(o.kosten).toFixed(2)}</td>
            </tr>
          `).join('')}
          ${allPanden.flatMap(p => p.onderhoud || []).length === 0 ? '<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">Geen onderhoud geregistreerd</td></tr>' : ''}
        </tbody>
      </table>
    </div>
  `;
}

// === HELPERS ===
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function attr(s) { return (s || '').replace(/"/g, '&quot;'); }
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function formatDate(d) { if (!d) return '-'; const [y, m, day] = d.split('-'); return `${day}-${m}-${y}`; }
function today() { return new Date().toISOString().slice(0, 10); }
function statusLabel(s) {
  const map = { afgerond: 'Afgerond', in_behandeling: 'In behandeling', gepland: 'Gepland' };
  return map[s] || s;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Init
checkAuth();
</script>
</body>
</html>
